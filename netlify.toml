# Netlify configuration — static output in dist/ (no server runtime needed)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://gameshowroomrockaway.com"
  # Tests use Playwright locally; skip its ~150 MB browser download on Netlify builds
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Indexing is OFF unless explicitly enabled. Flip ALLOW_INDEXING to "true" for the
# production context ONLY when the custom domain is live (see docs/deployment.md).
[context.production.environment]
  ALLOW_INDEXING = "false"

[context.deploy-preview.environment]
  ALLOW_INDEXING = "false"

[context.branch-deploy.environment]
  ALLOW_INDEXING = "false"

# Pre-deploy gate: build + SEO audit must pass (tests run in CI; see README)
[context.production]
  command = "npm run build && npm run seo:audit"

# ---------- Headers ----------
# Generated into dist/_headers by scripts/build.tsx (security, caching, X-Robots-Tag).

# Redirects live in dist/_redirects (generated from src/data/redirects.ts).
# Force a single host — uncomment after the custom domain is attached:
# [[redirects]]
#   from = "https://www.gameshowroomrockaway.com/*"
#   to = "https://gameshowroomrockaway.com/:splat"
#   status = 301
#   force = true
